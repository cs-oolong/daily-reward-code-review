[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-reward-review"
version = "0.1.0"
description = "Fictional gaming backend for a code review interview"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.5",
    "requests>=2.32",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
